- baseInfo:
    api_name: 删除用户
    url: /dar/user/deleteUser
    method: POST
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 有效删除用户
      data:
        user_id: 123839387391912
      validation:
        - contains: { 'msg': '删除成功' }
    - case_name: 无效删除用户·userid不存在
      data:
        user_id: 1238393873922
      validation:
        - contains: { 'msg': '删除失败' }
    - case_name: 无效删除用户·userid为空
      # 这里传空字符串，而不是照抄上一条的 user_id。
      # 原用例这里写的是 user_id: 1238393873922（和上一条一模一样），
      # 等于把上一条又跑了一遍：既没测到"userid 为空"这个场景，
      # 又因为两条用例的请求数据完全相同，Allure 报告里会被算成同一条用例（pytest 19 条只显示 18 条）。
      # 传 '' 时接口取到的是空串（不是 None），走的是"id 不在允许列表里"这条分支；
      # 和最后一条"缺少必填参数"（整个 data 都不传、取到 None）是两种不同的请求。
      data:
        user_id: ''
      validation:
        - contains: { 'msg': '删除失败' }
    - case_name: 无效删除用户·缺少必填参数
      validation:
        - contains: { 'msg': '删除失败' }
