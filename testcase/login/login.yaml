# 登录接口用例数据（模块三：登录）
#
# 被测接口：POST /dar/user/login（flask mock 服务 base/flask_service.py 的 user_login）
# 传参方式：form 表单 application/x-www-form-urlencoded
#           —— 接口用 flask.request.form.get('user_name') 取值，写成 json 会取不到参数
# 参数：user_name / passwd（写死的账号：test01 / admin123）
#
# 结构说明：
#   baseInfo  接口公共信息（baseInfo.url 会与 conf/conf.ini 里的 host 拼接成完整地址）
#   testCase  用例列表，一条 testCase 就是一条接口用例
#
# 断言关键字（由 common/assertions.py 实现，新增关键字要同步维护那里的 supported_keys）：
#   contains    字符串包含断言；写 status_code 时比较 HTTP 状态码，其它 key 走 $..key 递归取值后做包含判断
#   eq          相等断言；只比较写出来的字段（支持多字段），响应里的 token/userId 是 null 也能比对
#   not_null    字段存在且非空断言，值为 JSONPath 列表
#   not_exists  字段不存在断言（负向断言）
#   gt          数值大于断言，值为 {JSONPath: 阈值}
#
# 响应契约（三种分支）：
#   成功      {"msg": "登录成功", "msg_code": 200, "error_code": null, "token": "<29位>", "userId": "...", "orgId": "..."}
#   账号密码错 {"msg": "登录失败,用户名或密码错误", "msg_code": 9001, "token": null, "userId": null}
#   缺参数    {"msg": "参数错误", "msg_code": -1}
- baseInfo:
   api_name: 用户登录
   url: /dar/user/login
   method: post
   header:
     Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 登录成功-用户名和密码都正确
      data:
        user_name: test01
        passwd: admin123
      validation:
        # 第一层：HTTP 状态码（mock 服务统一用 jsonify 返回，成功失败都是 200）
        - contains: { 'status_code': 200 }
        # 第二层：业务状态码 + 提示语
        - eq: { 'msg_code': 200 }
        - contains: { 'msg': '登录成功' }
        # 第三层：登录成功必须下发凭证 token / userId（后面所有需要鉴权的接口都靠它）
        - not_null: [ '$.token', '$.userId' ]
      extract:
        # 接口关联：把登录结果写入 extract.yaml，供后续用例用 ${get_extract_data(token)} 引用
        # 注意：被测服务的 token 存在全局变量里，每成功登录一次就覆盖一次
        #（flask_service.py: global_params['token'] = token），
        # 而新增用户接口校验的正是这个全局值，所以"提取 token"必须和"服务端最新 token"是同一份。
        # 这也是 login 模块要排在其他模块前面的原因（见 test_login.py 的 CHAIN_ORDER）。
        token: $.token
        userId: $.userId

    - case_name: 登录失败-密码错误
      # 必须用真实存在的账号 test01，才是"密码错误"这条分支
      data:
        user_name: test01
        passwd: wrong_password
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg_code': 9001 }
        - contains: { 'msg': '登录失败' }
        # 负向断言：登录失败绝不能下发可用凭证。
        # 这里用 eq 比 not_exists 更严格 —— 响应里确实有 token/userId 两个字段，但值必须是 null。
        # 注意必须写 YAML 的 null：写成 None 会被解析成字符串 "None"，
        # 断言就变成「null == "None"」，这条用例会一直失败（踩过一次）
        - eq: { 'token': null, 'userId': null }

    - case_name: 登录失败-用户名不存在
      data:
        user_name: not_exist_user
        passwd: admin123
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg_code': 9001 }
        - contains: { 'msg': '登录失败' }
        - eq: { 'token': null, 'userId': null }

    - case_name: 登录失败-缺少密码必填字段
      # 只传用户名不传密码：接口里 all([user_name, passwd]) 判断不通过，
      # 返回的是"参数错误 msg_code=-1"，和"账号密码错误 9001"是两个不同分支
      data:
        user_name: test01
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg_code': -1 }
        - contains: { 'msg': '参数错误' }
